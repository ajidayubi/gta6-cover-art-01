<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice Cover Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>VICE COVER MAKER</h1>
    <p class="tagline">Create authentic retro crime-saga game covers offline</p>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="group">
        <label>Photos</label>
        <div class="thumbs"></div>
        <div class="row upload">
          <input type="file" id="photo-upload" accept="image/*">
        </div>
      </div>

      <div class="group">
        <label>Layout</label>
        <div class="row">
          <!-- Layout controls generated by app -->
        </div>
      </div>

      <div class="group">
        <label>Panels</label>
        <div class="row">
          <!-- Panel controls generated by app -->
        </div>
      </div>

      <div class="group">
        <label>Grade</label>
        <div class="row">
          <!-- Grade controls generated by app -->
        </div>
      </div>

      <div class="group">
        <label>Caption</label>
        <div class="row">
          <input type="text" id="title-input" value="SUNSET HEIST">
        </div>
        <div class="row">
          <input type="text" id="subtitle-input" value="NEON SUNSET • 2026">
        </div>
        <div class="row swatches">
          <!-- Swatches generated by app -->
        </div>
      </div>

      <div class="group">
        <label>Export</label>
        <div class="row">
          <button class="export" id="export-btn">Download Cover</button>
        </div>
        <div class="status"></div>
      </div>
    </section>

    <div class="preview">
      <canvas id="preview-canvas"></canvas>
    </div>
  </div>

  <footer>
    <p>This app runs entirely offline and your photos never leave your machine.</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
