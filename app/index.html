<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>Vice Cover Maker</h1>
  <p class="tagline">Your photo. Your caption. A poster cover.</p>
</header>
<main class="layout">
  <section class="panel" aria-label="Controls">
    <div class="group">
      <h2>Photos</h2>
      <div class="thumbs" id="thumbs"></div>
      <label class="upload">Upload photos
        <input type="file" id="upload" accept="image/*" multiple>
      </label>
    </div>
    <div class="group">
      <h2>Layout</h2>
      <div class="row" id="layouts">
        <button type="button" data-layout="Vice Trio" class="active">Vice Trio</button>
        <button type="button" data-layout="Four Corners">Four Corners</button>
        <button type="button" data-layout="Hero Strip">Hero Strip</button>
        <button type="button" data-layout="Single">Single</button>
      </div>
    </div>
    <div class="group">
      <h2>Panels</h2>
      <p id="panelName">Panel 1 selected</p>
      <label>Zoom <input type="range" id="zoom" min="1" max="3" step="0.05" value="1"></label>
      <div class="row">
        <button type="button" id="fillBtn" class="active">Fill</button>
        <button type="button" id="fitBtn">Fit</button>
      </div>
    </div>
    <div class="group">
      <h2>Grade</h2>
      <div class="row" id="grades">
        <button type="button" data-grade="Sunset" class="active">Sunset</button>
        <button type="button" data-grade="Neon">Neon</button>
        <button type="button" data-grade="Vice">Vice</button>
        <button type="button" data-grade="Noir">Noir</button>
      </div>
      <label><input type="checkbox" id="grain" checked> Grain</label>
      <label><input type="checkbox" id="vignette" checked> Vignette</label>
    </div>
    <div class="group">
      <h2>Caption</h2>
      <label>Title <input type="text" id="title" maxlength="40" value="SUNSET HEIST"></label>
      <label>Subtitle <input type="text" id="subtitle" maxlength="40" value="NEON SUNSET • 2026"></label>
      <label>Title size <input type="range" id="titleSize" min="0.7" max="1.3" step="0.05" value="1"></label>
      <div class="row swatches" id="swatches">
        <button type="button" data-color="#ffffff" class="active" aria-label="White"></button>
        <button type="button" data-color="#ffd166" aria-label="Yellow"></button>
        <button type="button" data-color="#7ff3ff" aria-label="Cyan"></button>
        <button type="button" data-color="#ff7ad9" aria-label="Pink"></button>
      </div>
    </div>
    <div class="group">
      <h2>Export</h2>
      <div class="row" id="sizes">
        <button type="button" data-size="1080x1080">Square</button>
        <button type="button" data-size="1080x1350">Portrait</button>
        <button type="button" data-size="1920x1080" class="active">Landscape</button>
      </div>
      <button type="button" id="exportBtn" class="export">Export PNG</button>
      <p id="status" class="status"></p>
    </div>
  </section>
  <section class="preview" aria-label="Preview">
    <canvas id="preview"></canvas>
  </section>
</main>
<footer>The app runs offline and photos never leave the machine.</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
