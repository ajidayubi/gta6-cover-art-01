<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice Cover Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>VICE COVER MAKER</h1>
    <p class="tagline">Create your own iconic retro crime saga cover art</p>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="group">
        <h3>Photos</h3>
        <div class="thumbs"></div>
        <div class="row upload">
          <input type="file" id="photo-upload" accept="image/*">
        </div>
      </div>

      <div class="group">
        <h3>Layout</h3>
        <div class="row">
          <label>Position X</label>
          <input type="range" id="layout-x" min="-100" max="100" value="0">
        </div>
        <div class="row">
          <label>Position Y</label>
          <input type="range" id="layout-y" min="-100" max="100" value="0">
        </div>
        <div class="row">
          <label>Zoom</label>
          <input type="range" id="layout-zoom" min="50" max="200" value="100">
        </div>
      </div>

      <div class="group">
        <h3>Panels</h3>
        <div class="row">
          <button type="button" id="panel-add">Add Panel</button>
          <button type="button" id="panel-remove">Remove Panel</button>
        </div>
      </div>

      <div class="group">
        <h3>Grade</h3>
        <div class="row">
          <label>Saturation</label>
          <input type="range" id="grade-sat" min="0" max="200" value="100">
        </div>
        <div class="row">
          <label>Contrast</label>
          <input type="range" id="grade-contrast" min="50" max="150" value="100">
        </div>
        <div class="row">
          <label>Vignette</label>
          <input type="range" id="grade-vignette" min="0" max="100" value="50">
        </div>
      </div>

      <div class="group">
        <h3>Caption</h3>
        <div class="row">
          <input type="text" id="title-input" value="SUNSET HEIST">
        </div>
        <div class="row">
          <input type="text" id="subtitle-input" value="NEON SUNSET • 2026">
        </div>
        <div class="row swatches">
          <button type="button" class="swatch" data-color="#ff7b00" style="background: #ff7b00;"></button>
          <button type="button" class="swatch" data-color="#ff0055" style="background: #ff0055;"></button>
          <button type="button" class="swatch" data-color="#00ffff" style="background: #00ffff;"></button>
          <button type="button" class="swatch" data-color="#ffff00" style="background: #ffff00;"></button>
        </div>
      </div>

      <div class="group">
        <h3>Export</h3>
        <div class="row">
          <button type="button" class="export">Export High-Res Cover</button>
        </div>
        <div class="status"></div>
      </div>
    </section>

    <div class="preview">
      <canvas id="cover-canvas"></canvas>
    </div>
  </div>

  <footer>
    <p>This app runs entirely offline. Your photos never leave your machine.</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
