<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vice Cover Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>VICE COVER MAKER</h1>
    <p class="tagline">An atmospheric retro crime-saga cover composition engine.</p>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="group">
        <h3>Photos</h3>
        <div class="thumbs"></div>
        <div class="row upload">
          <input type="file" id="image-upload" accept="image/*">
        </div>
      </div>

      <div class="group">
        <h3>Layout</h3>
        <div class="row">
          <label for="layout-mode">Composition</label>
          <select id="layout-mode">
            <option value="classic">Classic 3-Panel</option>
            <option value="single">Single Frame</option>
            <option value="duo">Duo Split</option>
          </select>
        </div>
      </div>

      <div class="group">
        <h3>Panels</h3>
        <div class="row">
          <label for="panel-split">Split Position</label>
          <input type="range" id="panel-split" min="20" max="80" value="33">
        </div>
      </div>

      <div class="group">
        <h3>Grade</h3>
        <div class="row">
          <label for="filter-preset">Preset</label>
          <select id="filter-preset">
            <option value="sunset">Sunset Neon</option>
            <option value="miami">Miami Noir</option>
            <option value="golden">Golden Hour</option>
            <option value="cyber">Cyberpunk</option>
          </select>
        </div>
        <div class="row">
          <label for="saturation-range">Saturation</label>
          <input type="range" id="saturation-range" min="0" max="200" value="120">
        </div>
        <div class="row">
          <label for="contrast-range">Contrast</label>
          <input type="range" id="contrast-range" min="50" max="150" value="110">
        </div>
      </div>

      <div class="group">
        <h3>Caption</h3>
        <div class="row">
          <label for="title-input">Title</label>
          <input type="text" id="title-input" value="SUNSET HEIST">
        </div>
        <div class="row">
          <label for="subtitle-input">Subtitle</label>
          <input type="text" id="subtitle-input" value="NEON SUNSET • 2026">
        </div>
        <div class="row swatches">
          <button class="swatch" data-color="#ffb703" style="background: #ffb703;" title="Amber"></button>
          <button class="swatch" data-color="#ff007f" style="background: #ff007f;" title="Hot Pink"></button>
          <button class="swatch" data-color="#00f5d4" style="background: #00f5d4;" title="Cyan"></button>
          <button class="swatch" data-color="#ffffff" style="background: #ffffff;" title="White"></button>
        </div>
      </div>

      <div class="group">
        <h3>Export</h3>
        <div class="row">
          <button class="export">Download Cover Art</button>
        </div>
        <div class="row status">Ready</div>
      </div>
    </section>

    <div class="preview">
      <canvas id="preview-canvas" width="1200" height="1500"></canvas>
    </div>
  </div>

  <footer>
    <p>This app runs entirely offline and photos never leave your machine.</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
